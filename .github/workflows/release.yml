name: Build & Release QuantD ISO

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y \
            git live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            syslinux-utils curl wget ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean previous build
        run: lb clean --purge || true

      - name: Configure live-build
        run: |
          lb config \
            --distribution trixie \
            --debian-installer live \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --compression xz \
            --bootappend-live "boot=live components quiet splash hostname=quantd username=quantd"

      # FIX 1: Ensure the ISO contains the tools to manage users and boot parameters
      - name: Inject Essential Live Packages
        run: |
          mkdir -p config/package-lists
          echo "live-boot live-config live-config-systemd sudo user-setup" > config/package-lists/live.list.chroot

      # FIX 2: Create the hook to set the password to 'live'
      - name: Setup User Password Hook
        run: |
          mkdir -p config/hooks/live
          cat <<EOF > config/hooks/live/0100-setup-user.chroot
          #!/bin/sh
          # Set password for the quantd user
          echo "quantd:live" | chpasswd
          # Grant sudo and hardware group access
          usermod -aG sudo,audio,video,cdrom,netdev quantd
          EOF
          chmod +x config/hooks/live/0100-setup-user.chroot

      - name: Build ISO
        run: lb build

      - name: Rename ISO
        run: |
          # Use GITHUB_REF_NAME for the tag name (e.g., v1.0.0)
          ISO_NAME="quantd-${GITHUB_REF_NAME}.iso"
          mv *.iso "$ISO_NAME"
          echo "ISO_NAME=$ISO_NAME" >> $GITHUB_ENV

      - name: Generate SHA256
        run: |
          sha256sum "$ISO_NAME" > "$ISO_NAME.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}