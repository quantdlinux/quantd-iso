name: Build & Release QuantD ISO

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # Step 1: Clean the HOST runner before starting the container
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo docker image prune -af

      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Use a shell script or direct run for the build
      # We move the container logic here to ensure privileged mode works correctly
      - name: Build in Debian Container
        run: |
          docker run --privileged -v $(pwd):/build -w /build debian:trixie /bin/bash -c "
            apt update && 
            apt install -y git live-build debootstrap squashfs-tools xorriso \
                           grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
                           syslinux-utils curl wget ca-certificates &&
            
            # Ensure the MATE 'engine' is present if not in your repo's package-lists
            mkdir -p config/package-lists &&
            echo 'xorg xinit dbus-x11 lightdm mate-desktop-environment-core' > config/package-lists/gui-fix.list.chroot &&

            lb clean --purge &&
            lb config \
              --distribution trixie \
              --debian-installer live \
              --archive-areas 'main contrib non-free non-free-firmware' \
              --binary-images iso-hybrid \
              --mirror-bootstrap http://deb.debian.org/debian/ \
              --mirror-binary http://deb.debian.org/debian/ \
              --mirror-chroot http://deb.debian.org/debian/ \
              --compression xz \
              --apt-recommends true \
              --apt-indices false \
              --bootappend-live 'boot=live components quiet splash hostname=quantd username=quantd' &&
            
            lb build
          "

      - name: Rename and Hash ISO
        run: |
          ISO_NAME="quantd-${GITHUB_REF_NAME}.iso"
          mv *.iso "$ISO_NAME"
          sha256sum "$ISO_NAME" > "$ISO_NAME.sha256"
          echo "ISO_NAME=$ISO_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}