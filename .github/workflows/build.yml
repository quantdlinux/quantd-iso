name: QuantD CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: debian:trixie
      options: --privileged

    steps:
   # Step 1: Clean the HOST runner before starting the build
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo docker image prune -af
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt update
          apt install -y \
            git live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            syslinux-utils curl wget ca-certificates

      - name: Clean previous build
        run: lb clean --purge || true

      - name: Configure live-build
        run: |
          export MKSQUASHFS_OPTIONS="-comp xz -Xbcj x86 -b 1M -Xdict-size 100%"
          lb config \
            --distribution trixie \
            --debian-installer live \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --mirror-bootstrap http://deb.debian.org/debian/ \
            --mirror-binary http://deb.debian.org/debian/ \
            --mirror-chroot http://deb.debian.org/debian/ \
            --compression xz \
            --bootappend-live "boot=live components quiet splash hostname=quantd username=quantd live-config.user-default-groups=sudo,audio,video,cdrom,netdev"

      - name: Build ISO
        run: lb build

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantd-ci-build
          path: "*.iso"