name: QuantD CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt update
          apt install -y \
            git live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            syslinux-utils curl wget ca-certificates

      - name: Clean previous build
        run: lb clean --purge || true

      - name: Configure live-build
        run: |
          lb config \
            --distribution trixie \
            --debian-installer live \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --compression xz \
            --bootappend-live "boot=live components quiet splash hostname=quantd username=quantd"

      # FIX 1: Ensure essential live configuration packages are included
      - name: Add required packages
        run: |
          mkdir -p config/package-lists
          echo "live-boot live-config live-config-systemd sudo user-setup" > config/package-lists/live.list.chroot

      # FIX 2: Create a hook to set the password for the 'quantd' user
      - name: Cleanup and Setup Correct Hook
        run: |
            # Remove the broken hook if it exists in the repo
            rm -f config/hooks/normal/0500-user-password.chroot || true
            
            # Create the correct directory and hook
            mkdir -p config/hooks/live
            cat <<EOF > config/hooks/live/0100-setup-user.chroot
            #!/bin/sh
            # Create user if it doesn't exist
            if ! id "quantd" >/dev/null 2>&1; then
                useradd -m -s /bin/bash quantd
            fi
            
            # Set the password to 'live'
            echo "quantd:live" | chpasswd
            
            # Add to sudo and groups
            usermod -aG sudo,audio,video,cdrom,netdev quantd
            EOF
            
            chmod +x config/hooks/live/0100-setup-user.chroot

      - name: Build ISO
        run: lb build

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantd-ci-build
          path: "*.iso"